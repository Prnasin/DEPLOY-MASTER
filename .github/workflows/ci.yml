name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-devops-app:${{ github.sha }} ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/fastapi-devops-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-devops-app:${{ github.sha }}
          
          # Also tag and push as latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/fastapi-devops-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fastapi-devops-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-devops-app:latest

      # In a full GitOps flow, you might have a step here to update the Kubernetes manifests 
      # (k8s/app-deployment.yaml) with the new image tag (${{ github.sha }}) and commit it back to the repo,
      # which ArgoCD would then detect and deploy. For simplicity, we are pushing `latest` as well.
