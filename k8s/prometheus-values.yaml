# These are custom values for the kube-prometheus-stack Helm chart.
# To install Prometheus and Grafana on Minikube:
#
# 1. Add the Helm repo:
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm repo update
#
# 2. Install the stack:
# helm install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f k8s/prometheus-values.yaml
#
# 3. Access Grafana:
# kubectl port-forward svc/prometheus-grafana -n monitoring 3000:80
# (Default login is admin / prom-operator)

grafana:
  adminPassword: "prom-operator"
  service:
    type: NodePort

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 2d
